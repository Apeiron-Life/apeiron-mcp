name: Build MCP image

# Builds the apeiron-mcp Docker image and pushes it to AWS ECR.
#
# Mirrors the apeiron-ml `Build backend` workflow:
#   * `feature/*` branches -> image tag = ticket number (e.g. APLF-664)
#   * `main`               -> image tag = next semantic version (e.g. 0.1.0)
#   * `staging`            -> image tag = stag-<version>       (e.g. stag-0.1.0)
#
# Every build also pushes `latest`. On `main` the next semantic version is
# pushed back to GitHub as a `v*` tag (e.g. v0.1.0).
#
# Required repository secrets (shared with apeiron-ml):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ECR_URL
#
# The image is built from the repository root (`./Dockerfile`, target
# `runtime`), so the same artifact is used by docker compose and by deploy.

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch
  workflow_dispatch:

permissions:
  contents: write

env:
  # ECR repository, relative to the registry in secrets.AWS_ECR_URL.
  ECR_REPOSITORY: phs/apeiron-mcp
  AWS_REGION: us-west-2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get Semantic Version
        id: version
        run: |
          BRANCH_NAME=$(echo "$GITHUB_REF" | sed 's|refs/heads/||')

          if [[ "$BRANCH_NAME" == feature/* ]]; then
            # Feature branch: extract ticket number
            TICKET_NUMBER=$(echo "$BRANCH_NAME" | sed -E 's/^feature\/([A-Za-z0-9\-]+)-([0-9]+).*/\1-\2/')
            NEW_TAG="${TICKET_NUMBER}"
            echo "Feature branch detected. Using ticket number as tag: $NEW_TAG"

          elif [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "staging" ]]; then
            # Main or Staging branch: use semantic versioning. Git tags carry a
            # leading `v` (`v0.1.0`) that the ECR tag does not (`0.1.0`).
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            TAG="${LATEST_TAG#v}"
            TAG="${TAG:-0.0.0}"
            echo "Current Tag: $TAG"
            IFS='.' read -r major minor patch <<< "$TAG"
            new_patch=$((patch + 1))
            VERSION="$major.$minor.$new_patch"

            if [[ "$BRANCH_NAME" == "staging" ]]; then
              NEW_TAG="stag-$VERSION"
            else
              NEW_TAG="$VERSION"
            fi

            echo "$BRANCH_NAME branch detected. New tag: $NEW_TAG"

          else
            echo "::error::Unsupported branch '$BRANCH_NAME'. Build failed."
            exit 1
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_ENV

      - name: Authenticate with AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_URL }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.AWS_ECR_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.tag }} --target runtime .
          docker tag ${{ secrets.AWS_ECR_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.tag }} ${{ secrets.AWS_ECR_URL }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push Docker Image to AWS ECR
        run: |
          docker push ${{ secrets.AWS_ECR_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.tag }}
          docker push ${{ secrets.AWS_ECR_URL }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push next semantic tag to GitHub (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "Fetching all tags from GitHub..."
          git fetch --tags

          # Find the latest tag starting with v
          LATEST_TAG=$(git tag --sort=-creatordate | grep '^v' | head -n1)
          echo "Latest tag found: $LATEST_TAG"

          if [[ -z "$LATEST_TAG" ]]; then
            NEXT_TAG="v0.0.1"
          else
            VERSION=${LATEST_TAG#v}              # Remove 'v'
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))                # Increment patch
            NEXT_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "Next tag to push: $NEXT_TAG"

          # Create the new tag locally pointing to current commit
          git tag -f "$NEXT_TAG"

          # Push the new tag to GitHub
          git push origin "$NEXT_TAG"
