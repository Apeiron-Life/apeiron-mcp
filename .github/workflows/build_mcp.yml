name: Build MCP image

# Builds the apeiron-mcp Docker image and pushes it to AWS ECR.
#
# Image tags (see .github/scripts/image_tag.sh):
#   * `main`      -> next free semantic version, e.g. 0.1.0; the same version is
#                    pushed back to GitHub as the `v*` tag (e.g. v0.1.0)
#   * `staging`   -> stag-<next version>-<short sha>, e.g. stag-0.1.0-1a2b3c4
#   * `feature/*` -> <ticket>-<short sha>,             e.g. APLF-664-1a2b3c4
#
# The ECR repository uses immutable tags, so a tag can never be overwritten
# (there is no mutable `latest`). The next version is therefore computed from
# both the semver git tags (`vX.Y.Z`) and the tags already in ECR, runs on the
# same branch are serialized, and a rerun for a commit whose image is already
# in ECR is a no-op. Deploy pulls an explicit tag (see deploy_mcp.yml).
#
# Required repository secrets (shared with apeiron-ml):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ECR_URL
#
# The image is built from the repository root (`./Dockerfile`, target
# `runtime`), so the same artifact is used by docker compose and by deploy.

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs per branch so two runs never pick the same tag. A run that is
# already publishing is never cancelled (GitHub keeps only the newest pending
# run per group; it builds the latest commit anyway).
concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # -eo pipefail

env:
  # ECR repository, relative to the registry in secrets.AWS_ECR_URL.
  ECR_REPOSITORY: phs/apeiron-mcp
  AWS_REGION: us-west-2
  LOCAL_IMAGE: apeiron-mcp:build

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint and test image tag selection
        run: |
          shellcheck .github/scripts/*.sh
          bash .github/scripts/test_image_tag.sh

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect existing git and ECR tags
        run: |
          git fetch --tags --force
          git tag -l > "$RUNNER_TEMP/git_tags.txt"
          git tag --points-at "$GITHUB_SHA" > "$RUNNER_TEMP/head_tags.txt"

          # Any ECR error (auth, missing repository, throttling...) fails here.
          aws ecr list-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --filter tagStatus=TAGGED \
            --query 'imageIds[].imageTag' \
            --output text | tr '\t' '\n' > "$RUNNER_TEMP/ecr_tags.txt"
          echo "Found $(grep -c . "$RUNNER_TEMP/ecr_tags.txt" || true) tags in ECR."

      - name: Select image tag
        id: resolve
        run: |
          .github/scripts/image_tag.sh resolve "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            "$RUNNER_TEMP/git_tags.txt" "$RUNNER_TEMP/head_tags.txt" "$RUNNER_TEMP/ecr_tags.txt" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate with AWS ECR
        if: steps.resolve.outputs.skip != 'true'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ secrets.AWS_ECR_URL }}"

      - name: Build Docker Image
        if: steps.resolve.outputs.skip != 'true'
        run: |
          docker build -t "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --target runtime .

      - name: Push Docker Image to AWS ECR
        id: publish
        if: steps.resolve.outputs.skip != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          .github/scripts/image_tag.sh publish "$GITHUB_REF_NAME" \
            "${{ secrets.AWS_ECR_URL }}/$ECR_REPOSITORY" "$LOCAL_IMAGE" "$TAG" \
            "$RUNNER_TEMP/git_tags.txt" "$RUNNER_TEMP/ecr_tags.txt" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Push matching semantic tag to GitHub (main only)
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.pushed == 'true'
        env:
          # Exactly the version that was published to ECR.
          GIT_TAG: v${{ steps.publish.outputs.tag }}
        run: |
          if existing=$(git rev-parse -q --verify "refs/tags/$GIT_TAG^{commit}"); then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "$GIT_TAG already points at $GITHUB_SHA."
              exit 0
            fi
            echo "::error::$GIT_TAG already exists on $existing, not $GITHUB_SHA."
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # No -f: never move an existing tag.
          git tag "$GIT_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$GIT_TAG"

      - name: Summary
        env:
          TAG: ${{ steps.publish.outputs.tag || steps.resolve.outputs.tag }}
          PUSHED: ${{ steps.publish.outputs.pushed || 'false' }}
        run: |
          echo "Image: $ECR_REPOSITORY:$TAG (pushed in this run: $PUSHED)" | tee -a "$GITHUB_STEP_SUMMARY"
